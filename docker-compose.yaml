version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: bda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql_password
      MYSQL_DATABASE: dwh_mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      POSTGRES_CONFIG: >
        {
          "host": "postgres",
          "port": 5432,
          "database": "bda",
          "user": "postgres",
          "password": "postgres"
        }
      MYSQL_CONFIG: >
        {
          "host": "mysql",
          "port": 3306,
          "database": "dwh_mysql",
          "user": "root",
          "password": "mysql_password"
        }
      POSTGRES_SCHEMA: s_sql_dds
      MYSQL_SCHEMA: s_sql_dm
    volumes:
      - .:/app
    command: python main.py

volumes:
  postgres_data:
  mysql_data:
